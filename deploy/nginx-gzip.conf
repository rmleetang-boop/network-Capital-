# Network Capital — nginx gzip block (Iter 58)
# Drop this inside the `http {}` block of your production nginx.conf.
# Verified syntax-OK locally with `nginx -t`.

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 256;
gzip_buffers 16 8k;
gzip_http_version 1.1;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/xml
    application/xml+rss
    image/svg+xml;
